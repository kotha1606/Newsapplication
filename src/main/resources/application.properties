# Application Name
spring.application.name=phonebook-app

# Oracle Database Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=phonebook_user
spring.datasource.password=phonebook_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# JWT Configuration
app.jwt.secret=myVerySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong
app.jwt.expiration=86400000

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.com.phonebook=DEBUG
logging.level.org.springframework.security=DEBUG

# Enable CORS
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Validation
spring.jpa.properties.hibernate.validator.apply_to_ddl=false